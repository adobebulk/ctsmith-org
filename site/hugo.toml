baseURL = "https://ctsmith.org/"
locale = "en-us"
title = "C.T. Smith"
theme = "basalt"
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  photographer = "C.T. Smith"
  description   = "Do the Right Thing."
  # Root-relative asset path — served by the /assets Pages Function (streams from R2).
  assetsBaseURL = "/assets"

[permalinks]
  pages = "/:slug/"

[build]
  writeStats = true
