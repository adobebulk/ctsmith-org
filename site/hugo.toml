baseURL = "https://ctsmith.org/"
languageCode = "en-us"
title = "C.T. Smith"
theme = "hextra"

# Asset handling
assetDir = "assets"
assetsBaseURL = "/assets"

# Output formats
outputs.home = ["HTML", "JSON"]

# Menu
[menu]
[[menu.main]]
name = "Home"
pageRef = "/"
weight = 1

[[menu.main]]
name = "About"
pageRef = "/about"
weight = 2

[[menu.main]]
name = "Work"
pageRef = "/portfolio"
weight = 3

[[menu.main]]
name = "Writing"
pageRef = "/blog"
weight = 4

# Params
[params]
title = "C.T. Smith"
description = "Personal website and creative portfolio"
logo = "logo.svg"
logoWidth = 40

# Hextra-specific params
[params.hextra]
enableSearch = true
enableDarkMode = true

# Social links
[[params.social]]
icon = "github"
link = "https://github.com"
label = "GitHub"

[[params.social]]
icon = "linkedin"
link = "https://linkedin.com"
label = "LinkedIn"
