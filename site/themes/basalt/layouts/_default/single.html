<!DOCTYPE html>
<html lang="en">
<head>{{ partial "head.html" . }}</head>
<body class="min-h-screen flex flex-col bg-white text-black dark:bg-black dark:text-white font-sans">
  {{ partial "header.html" . }}

  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-medium tracking-tight leading-tight">{{ .Title }}</h1>
    <div class="mt-8 prose dark:prose-invert max-w-none text-sm leading-relaxed">
      {{ .Content }}
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
